services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: naijadesign
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["naijadesign_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d naijadesign"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  naijadesign_pg:
